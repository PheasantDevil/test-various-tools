name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '18.x'
        cache: 'yarn'
    
    - name: Install dependencies
      run: yarn install --frozen-lockfile
    
    - name: Build
      run: yarn build
      env:
        REACT_APP_GITHUB_API_TOKEN: ${{ secrets.REACT_APP_GITHUB_API_TOKEN }}
        REACT_APP_SLACK_API_TOKEN: ${{ secrets.REACT_APP_SLACK_API_TOKEN }}
    
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: build
        branch: gh-pages 
